<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ghost Pepper">
  <defs>
    <linearGradient id="gpFlame" x1="0" y1="64" x2="0" y2="0">
      <stop offset="0" stop-color="#e11212"/>
      <stop offset=".5" stop-color="#ff5e1a"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="gpBlue" x1="0" y1="64" x2="64" y2="0">
      <stop offset="0" stop-color="#1e63ff"/>
      <stop offset="1" stop-color="#00b3ff"/>
    </linearGradient>
  </defs>
  <!-- outer ghost-pepper body as a teardrop flame -->
  <path d="M32 3 C20 16 12 27 12 39 a20 20 0 0 0 40 0 C52 27 44 16 32 3 Z"
        fill="url(#gpFlame)" stroke="#ffd27a" stroke-width="1"/>
  <!-- inner blue flame core -->
  <path d="M32 22 C26 30 23 35 23 41 a9 9 0 0 0 18 0 C41 35 38 30 32 22 Z"
        fill="url(#gpBlue)" opacity=".92"/>
  <!-- ghost eyes (negative space) -->
  <circle cx="27" cy="40" r="2.6" fill="#05050a"/>
  <circle cx="37" cy="40" r="2.6" fill="#05050a"/>
  <!-- stem -->
  <path d="M32 3 c2 -2 6 -3 8 -2 c-2 2 -4 4 -8 5 Z" fill="#39ff14"/>
</svg>
